<html>
  <body>
    <script>
      (async () => {
        const response = await fetch('https://api.github.com/repos/leaffolkshaman/leaffolkshaman.github.io/contents/randomart');
        const data = await response.json();
        let htmlString = '';
        
        for (let file of data) {
          htmlString += `<video width="320" height="240" controls><source src="https://leaffolkshaman.github.io/${file.path}" type="video/mp4">Your browser does not support the video tag.</video>`
        }
        document.getElementsByTagName('body')[0].innerHTML = htmlString;
      })()
    </script>
  <body>
</html>
